workflows:
  weather-zheer-workflow:
    name: Weather Zheer Workflow
    max_build_duration: 30
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Build iOS IPA
        script: |
          flutter build ios --release --no-codesign
          mkdir -p Payload
          mv build/ios/iphoneos/Runner.app Payload/
          zip -r weather_zheer.ipa Payload
    artifacts:
      - weather_zheer.ipa