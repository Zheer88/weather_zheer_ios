workflows:
  weather-zheer-workflow:
    name: Weather Zheer Workflow
    max_build_duration: 30
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Build iOS IPA
        script: |
          flutter build ipa --release --no-codesign
    artifacts:
      - build/**/outputs/**/*.ipa
      artifacts:
  - build/ios/ipa/*.ipa